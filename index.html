<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 업무자동화 설계자</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f5fa;--card:#fff;--ink:#1b2437;--sub:#5b6881;--line:#d6dde9;--navy:#14306b;--blue:#2559c4;--soft:#e8effc;--loop:#eef3fb;--ok:#1a7f4b;--okbg:#e3f4ea;--warn:#a15c00;--warnbg:#fdf0d9;--err:#b3261e;--errbg:#fbe6e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#e6ebf6;--sub:#9aa7c2;--line:#2b3a5c;--navy:#0b1a3f;--blue:#6e9bff;--soft:#1f2f55;--loop:#142039;--okbg:#14382a;--warnbg:#3a2c10;--errbg:#3d1c1a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:10px 24px}
header b{font-size:16px}nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{color:#c5d3f3;padding:8px 14px;border-radius:3px;text-decoration:none;cursor:pointer}
nav a.on{background:#fff;color:var(--navy);font-weight:700}
.intro{padding:18px 24px 6px}.intro h1{margin:0;font-size:22px;color:var(--navy)}
.intro .sub{color:var(--blue);font-weight:600;margin:2px 0 6px}.intro p{margin:0;color:var(--sub);max-width:900px}
@media (prefers-color-scheme:dark){.intro h1{color:var(--ink)}}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:14px 24px 28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}header,.intro{padding-left:12px;padding-right:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}h3{font-size:14px;margin:0 0 8px}
@media (prefers-color-scheme:dark){h2{color:var(--ink)}}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}label i{font-weight:400;color:var(--sub);font-style:normal}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
textarea{min-height:190px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,nav a:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:3px}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;font-size:15px;padding:12px;width:100%;margin-top:10px}
@media (prefers-color-scheme:dark){button.pri{background:var(--blue);border-color:var(--blue);color:#0b1a3f}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.head h2{margin:0;font-size:19px}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{padding:6px 10px;font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;background:var(--okbg);color:var(--ok);margin-right:6px}
.badge.b{background:var(--soft);color:var(--blue)}.badge.rag{background:var(--warnbg);color:var(--warn);font-size:11px;padding:1px 6px;margin:0 6px 0 0}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:2px solid var(--line);margin:12px 0}
.tab{padding:9px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--sub);background:none;border-radius:0;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg)}.mini small{color:var(--sub);display:block}.mini b{display:block;margin-top:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}th{background:var(--soft);white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg)}
.arch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.arch span.n{background:var(--soft);border:1px solid var(--blue);border-radius:4px;padding:8px 12px;font-weight:600}.arch span.a{color:var(--blue);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}}
pre.code{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:3px;white-space:pre-wrap;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;margin:0}
.exc{border-left:4px solid var(--err);background:var(--errbg)}.exc div{margin-top:4px}
.flowwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}@media(max-width:900px){.flowwrap{grid-template-columns:1fr}}
.flowwrap svg{width:100%;height:auto;max-width:700px;display:block;margin:auto}
.fn{cursor:pointer}.fn .sh{fill:var(--card);stroke:var(--blue);stroke-width:1.5}.fn.dec .sh{fill:var(--warnbg);stroke:var(--warn)}.fn.se .sh{fill:var(--navy);stroke:var(--navy)}
.fn.se text{fill:#fff}.fn.sel .sh{stroke-width:3;stroke:var(--err)}.fn:focus{outline:none}.fn:focus .sh{stroke-width:3}
.fn text{fill:var(--ink);font-size:12.5px;text-anchor:middle;pointer-events:none}
.edge{fill:none;stroke:var(--sub);stroke-width:1.5}.edge.back{stroke-dasharray:5 4;stroke:var(--blue)}.el{fill:var(--sub);font-size:11.5px;font-weight:700}
.loopbox{fill:var(--loop);stroke:var(--blue);stroke-dasharray:6 4}.looplbl{fill:var(--blue);font-weight:700;font-size:13px}
.detail dl{margin:0}.detail dt{font-size:12px;color:var(--sub);margin-top:8px}.detail dd{margin:0;font-weight:600}
.ref ul{margin:6px 0 0;padding-left:0;list-style:none}.ref li{padding:3px 0}
.empty{text-align:center;color:var(--sub);padding:60px 10px}
dialog{width:min(760px,94vw);border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(10,20,40,.5)}dialog pre{max-height:60vh;overflow:auto}
@media print{header,.intro,.left,.tools,.tabs{display:none}main{display:block;padding:0}.pane{display:block!important;break-inside:avoid;margin-bottom:12px}}
</style></head><body>
<header><b>AI 업무자동화 플랫폼</b><nav id="nav"></nav></header>
<div class="intro"><h1>AI 업무자동화 설계자</h1><div class="sub">업무를 설명하면 Brity RPA 구현 설계도를 생성합니다.</div>
<p>자동화하고 싶은 업무를 자연어로 입력하면 기존 자동화 사례와 Brity RPA 기술정보를 기반으로 필요한 Action, 변수, 반복문, 조건문 및 구현 Flow를 설계합니다.</p></div>
<main>
<section class="card left"><h2>자동화할 업무를 설명해주세요</h2>
<label for="f_name">업무명 <i>(선택)</i></label><input id="f_name">
<label for="f_desc">업무 설명</label>
<textarea id="f_desc" placeholder="예)&#10;매일 ERP에 접속해서 수의계약 체결 대상 건을 조회하고,&#10;엑셀에 있는 계약번호를 한 건씩 입력한 후&#10;계약상태가 '체결대기'인 경우 체결 버튼을 누르고&#10;처리 결과를 엑셀에 저장하고 싶습니다."></textarea>
<div class="g2"><div><label for="f_dept">담당 부서 <i>(선택)</i></label><input id="f_dept"></div>
<div><label for="f_sys">대상 시스템 <i>(선택)</i></label><input id="f_sys"></div>
<div><label for="f_cycle">실행 주기 <i>(선택)</i></label><input id="f_cycle"></div>
<div><label for="f_cnt">예상 처리 건수 <i>(선택)</i></label><input id="f_cnt"></div></div>
<label for="f_file">입력 파일 <i>(선택)</i></label><input id="f_file" placeholder="예) 수의계약_대상목록.xlsx">
<div class="row"><button id="bEx">예제 불러오기</button><button id="bReset">설계 초기화</button></div>
<button class="pri" id="bGen">AI 자동화 설계 생성</button></section>
<section id="right"></section>
</main>
<dialog id="dlg"><div class="head"><h2>automationDesign (JSON)</h2><div class="tools"><button id="bCopy">JSON 복사</button><button id="bClose">닫기</button></div></div><pre class="code" id="jsonOut"></pre></dialog>

{title:"Excel 저장 실패",handling:["임시파일 저장","오류 로그"]}],

{id:"TC-002",desc:"이미 체결된 계약",input:"이미체결",expect:"체결하지 않고 결과 기록",status:"대기"},
{id:"TC-003",desc:"없는 계약번호",input:"계약정보 없음",expect:"오류 기록 후 다음 계약",status:"대기"},

const MENUS=["업무 자동화 설계","기존 자동화 사례","Brity 라이브러리","설정"];
const TABS=[["overview","전체 설계"],["actions","Brity Action"],["flow","Flow"],["vars","변수"],["cond","조건·반복"],["impl","상세 구현"],["exc","예외처리"],["test","테스트"]];
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let design=null,tab="overview",sel="d1";

/* [1] 생성형 AI API 연결 위치 — 현재는 Mock 반환 */
async function generateDesign(form){ /* const res=await fetch(AI_API_URL,{method:"POST",body:JSON.stringify(form)}); return await res.json(); */ return structuredClone(MOCK_DESIGN); }

const table=(cols,rows)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function flowSvg(d){
 const nodes=d.flowNodes,N=Object.fromEntries(nodes.map(n=>[n.id,n]));
 const edges=d.flowEdges.map(e=>`<polyline class="edge ${e.back?"back":""}" points="${e.p}" marker-end="url(#ar)"/>${e.l?`<text class="el" x="${e.lx}" y="${e.ly}">${esc(e.l)}</text>`:""}`).join("");
 const shp=n=>{const x=n.x-n.w/2,y=n.y-n.h/2;
  if(n.type==="dec")return`<polygon class="sh" points="${n.x},${y} ${n.x+n.w/2},${n.y} ${n.x},${y+n.h} ${x},${n.y}"/>`;
  return`<rect class="sh" x="${x}" y="${y}" width="${n.w}" height="${n.h}" rx="${n.type==="se"?n.h/2:3}"/>`};
 const g=nodes.map(n=>`<g class="fn ${n.type} ${n.id===sel?"sel":""}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}">${shp(n)}<text x="${n.x}" y="${n.y+4.5}">${esc(n.label)}</text></g>`).join("");
 return`<svg viewBox="0 0 700 940" role="img" aria-label="자동화 순서도"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sub)"/></marker></defs>
 <rect class="loopbox" x="20" y="205" width="670" height="530" rx="6"/><text class="looplbl" x="34" y="224">FOR EACH 계약 건</text>${edges}${g}</svg>`;
}
function detailHtml(d){const n=d.flowNodes.find(x=>x.id===sel);if(!n)return"";
 return`<div class="card detail"><h3>${esc(n.label)}</h3><dl>${[["단계명",n.label],["Brity Action",n.action],["입력값",n.input],["출력값",n.output],["사용 변수",n.vars],["예외처리",n.exc]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`}

const PANES={
overview:d=>{const t=d.task;return`<div class="cards">${[["업무 목적",t.purpose],["대상 시스템",t.system],["자동화 방식",t.method],["입력",t.input],["출력",t.output],["자동화 적합성",t.suitability]].map(([k,v])=>`<div class="mini"><small>${k}</small><b>${esc(v)}</b></div>`).join("")}</div>
 <h3 style="margin-top:18px">Architecture</h3><div class="arch">${d.architecture.steps.map((s,i)=>(i?`<span class="a">→</span>`:"")+`<span class="n">${esc(s)}</span>`).join("")}</div>`},
actions:d=>table([["no","순서"],["func","기능"],["brityAction","Brity Action"],["use","용도"],["input","입력"],["output","출력"]],d.actions),
flow:d=>`<div class="flowwrap"><div>${flowSvg(d)}</div><div id="det">${detailHtml(d)}<p style="color:var(--sub);font-size:12px">순서도의 단계를 클릭하면 상세 정보가 표시됩니다.</p></div></div>`,
vars:d=>table([["name","변수명"],["desc","설명"],["type","Type"],["init","초기값"],["step","사용단계"]],d.variables),
cond:d=>`<div class="two"><div class="card"><h3>조건문</h3>${d.conditions.map(c=>`<pre class="code">${esc(c.code)}</pre>`).join("")}</div>
 <div class="card"><h3>반복문</h3>${d.loops.map(l=>`<div class="mini"><small>반복 대상</small><b>${esc(l.target)}</b></div><div class="mini" style="margin-top:6px"><small>반복 단위</small><b>${esc(l.unit)}</b></div><div class="mini" style="margin-top:6px"><small>반복 변수</small><b>${esc(l.variable)}</b></div><h3 style="margin-top:12px">반복 내부 작업</h3><ol>${l.body.map(b=>`<li>${esc(b)}</li>`).join("")}</ol><div class="mini"><small>종료 조건</small><b>${esc(l.end)}</b></div>`).join("")}</div></div>`,
impl:d=>table([["step","Step"],["type","구분"],["task","업무"],["action","Brity Action"],["input","입력"],["output","출력"],["vars","변수"],["exc","예외처리"]],d.implementationSteps),
exc:d=>`<div class="cards">${d.exceptions.map(e=>`<div class="card exc"><h3>${esc(e.title)}</h3>${e.handling.map(h=>`<div>→ ${esc(h)}</div>`).join("")}</div>`).join("")}</div>`,
test:d=>table([["id","Test ID"],["desc","테스트 내용"],["input","입력값"],["expect","예상 결과"],["status","상태"]],d.tests)};

function render(){
 const r=$("#right");
 if(!design){r.innerHTML=`<div class="card empty"><h2>설계 결과가 여기에 표시됩니다</h2><p>왼쪽에 업무를 입력하거나 [예제 불러오기]를 누른 뒤 [AI 자동화 설계 생성]을 눌러주세요.</p></div>`;return}
 const d=design,t=d.task;
 r.innerHTML=`<div class="card"><div class="head"><div><h2>${esc(t.title)}</h2><span class="badge">${esc(t.fit)}</span><span class="badge b">추천 방식: ${esc(t.method)}</span></div>
 <div class="tools"><button id="bPrint">설계 결과 인쇄</button><button id="bJson">JSON 보기</button></div></div>
 <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab ${k===tab?"on":""}" role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("")}</div>
 <div class="pane" style="display:block">${PANES[tab](d)}</div>
 <div class="ref card" style="margin-top:16px"><h3>AI 참고자료</h3><div class="two"><div><b>참고한 기존 자동화 사례</b><ul>${d.references.cases.map(c=>`<li><span class="badge rag">RAG</span>${esc(c)}</li>`).join("")}</ul></div><div><b>참고한 Brity 지식</b><ul>${d.references.knowledge.map(c=>`<li><span class="badge rag">RAG</span>${esc(c)}</li>`).join("")}</ul></div></div>
 <p style="color:var(--sub);font-size:12px;margin:8px 0 0">실제 서비스에서는 RAG 검색 결과가 이 영역에 전달됩니다.</p></div></div>`;
}
const fields={name:"#f_name",desc:"#f_desc",dept:"#f_dept",sys:"#f_sys",cycle:"#f_cycle",cnt:"#f_cnt",file:"#f_file"};
const getForm=()=>Object.fromEntries(Object.entries(fields).map(([k,s])=>[k,$(s).value]));
const setForm=f=>Object.entries(fields).forEach(([k,s])=>$(s).value=f[k]||"");

$("#nav").innerHTML=MENUS.map((m,i)=>`<a class="${i?"":"on"}" tabindex="0" data-m="${i}">${m}</a>`).join("");
$("#nav").addEventListener("click",e=>{const a=e.target.closest("a");if(a&&a.dataset.m!=="0")alert("프로토타입에서는 '업무 자동화 설계' 화면만 제공됩니다.")});
$("#bEx").onclick=()=>setForm(MOCK_FORM);
$("#bReset").onclick=()=>{setForm({});design=null;tab="overview";render()};
$("#bGen").onclick=async()=>{
 if(!$("#f_desc").value.trim()){alert("업무 설명을 입력하거나 [예제 불러오기]를 눌러주세요.");$("#f_desc").focus();return}
 design=await generateDesign(getForm());tab="overview";sel="d1";render()};
$("#bClose").onclick=()=>$("#dlg").close();
$("#bCopy").onclick=async()=>{const s=JSON.stringify(design,null,2);try{await navigator.clipboard.writeText(s);$("#bCopy").textContent="복사 완료"}catch(e){const r=document.createRange();r.selectNodeContents($("#jsonOut"));getSelection().removeAllRanges();getSelection().addRange(r);$("#bCopy").textContent="선택됨: Ctrl+C로 복사"}setTimeout(()=>$("#bCopy").textContent="JSON 복사",2000)};
$("#right").addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();return}
 const fn=e.target.closest(".fn");if(fn){sel=fn.dataset.id;render();return}
 if(e.target.id==="bPrint")window.print();
 if(e.target.id==="bJson"){$("#jsonOut").textContent=JSON.stringify(design,null,2);$("#bCopy").textContent="JSON 복사";$("#dlg").showModal()}});
$("#right").addEventListener("keydown",e=>{const fn=e.target.closest(".fn");if(fn&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sel=fn.dataset.id;render();document.querySelector(`.fn[data-id="${sel}"]`)?.focus()}});
render();
</script></body></html>
